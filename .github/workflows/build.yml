# This workflow builds, tests and (on main) publishes a release of the Go module.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go
#
# Security hardening:
# - Third-party actions are pinned to full commit SHAs (immutable) with the tag in a comment.
# - Permissions are least-privilege: read by default, write only for the release job.
# - Dependencies are downloaded from the committed go.mod/go.sum (verifiable) instead of `go get`.
# - govulncheck scans for known vulnerabilities on every push.

name: Test and Publish

env:
  major: 1
  minor: 2
  # Toggle the "Vulnerability scan" step: 'true' to run it, 'false' to skip it.
  run_vuln_scan: 'false'

on:
  push:
    branches: [ "main" ]

# Default to read-only; individual jobs elevate only what they need.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.2.0
        with:
          go-version: 1.25.x
          check-latest: true

      - name: Download dependencies
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Vulnerability scan
        if: ${{ env.run_vuln_scan == 'true' }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: Test
        run: go test -race -v ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the git tag and GitHub release
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.2.1
        with:
          tag_name: v${{ env.major }}.${{ env.minor }}.${{ github.run_number }}
          name: v${{ env.major }}.${{ env.minor }}.${{ github.run_number }}
          draft: false
          prerelease: false

      - name: Update Go package repository
        run: curl -sSf "https://proxy.golang.org/github.com/go-yaaf/yaaf-common-pubsub/@v/v${{ env.major }}.${{ env.minor }}.${{ github.run_number }}.info"
        env:
          GOPROXY: proxy.golang.org
